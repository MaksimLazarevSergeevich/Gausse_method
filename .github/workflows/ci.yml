name: CI

on:
  push:
    branches:
      - gausse_branch
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
        submodules: recursive

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev libeigen3-dev

      - name: Build C++ code
        run: |
          make
          make test
          ./test-gausse

